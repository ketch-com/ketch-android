apply plugin: "com.github.ben-manes.versions"
apply plugin: "org.jlleitschuh.gradle.ktlint"
apply plugin: 'maven-publish'
apply plugin: "org.jetbrains.dokka"

buildscript {
    ext.buildConfig = [
            'minSdk'      : 26,
            'targetSdk'   : 36,
            'compileSdk'  : 36,
            'versionCode' : 3,
            'versionName' : '3.0'
    ]
    ext.versions = [
            'javaVersion' :  17,
            'kotlin'      : '2.1.20',
            'ktx'         : '1.17.0',
            'appcompat'   : '1.7.1',
            'dokka'       : '1.9.20',
            'junit'       : '4.13.2',
            'gson'        : '2.13.2',
            'webkit'      : '1.15.0'
    ]
    // Build-tooling deps pinned to advisory-clear versions (KD-17795). None ship in the AAR.
    ext.securityPins = [
            'org.bitbucket.b_c:jose4j:0.9.6',
            'org.bouncycastle:bcprov-jdk18on:1.84',
            'org.bouncycastle:bcpkix-jdk18on:1.84',
            'org.bouncycastle:bcutil-jdk18on:1.84',
            'org.apache.commons:commons-lang3:3.18.0',
            'org.apache.httpcomponents:httpclient:4.5.14',
            // jetifier-processor pulls 2.0.6 (XXE, CVE-2021-33813)
            'org.jdom:jdom2:2.0.6.1',
            // already resolves to 3.25.5, but only via highest-wins over a 3.22.3 request
            'com.google.protobuf:protobuf-java:3.25.5',
            'com.fasterxml.jackson.core:jackson-core:2.18.8',
            'com.fasterxml.jackson.core:jackson-databind:2.18.8',
            'com.fasterxml.jackson.core:jackson-annotations:2.18.8',
            'com.fasterxml.jackson.dataformat:jackson-dataformat-xml:2.18.6',
            'com.fasterxml.jackson.module:jackson-module-kotlin:2.18.6',
            'com.fasterxml.jackson.module:jackson-module-jaxb-annotations:2.18.6',
            'io.netty:netty-buffer:4.1.136.Final',
            'io.netty:netty-codec:4.1.136.Final',
            'io.netty:netty-codec-http:4.1.136.Final',
            'io.netty:netty-codec-http2:4.1.136.Final',
            'io.netty:netty-codec-socks:4.1.136.Final',
            'io.netty:netty-common:4.1.136.Final',
            'io.netty:netty-handler:4.1.136.Final',
            'io.netty:netty-handler-proxy:4.1.136.Final',
            'io.netty:netty-resolver:4.1.136.Final',
            'io.netty:netty-transport:4.1.136.Final',
            'io.netty:netty-transport-native-unix-common:4.1.136.Final'
    ]
    repositories {
        google()
        mavenCentral()
        maven { url "https://plugins.gradle.org/m2/" }
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.0.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${versions.kotlin}"
        classpath "org.jetbrains.kotlin:kotlin-serialization:${versions.kotlin}"
        classpath "de.mannodermaus.gradle.plugins:android-junit5:2.0.1"
        classpath "com.github.ben-manes:gradle-versions-plugin:0.52.0"
        classpath "org.jlleitschuh.gradle:ktlint-gradle:14.0.1"
        classpath "org.jetbrains.kotlin:compose-compiler-gradle-plugin:${versions.kotlin}"
        classpath "org.jetbrains.dokka:dokka-gradle-plugin:${versions.dokka}"
    }
    configurations.classpath {
        resolutionStrategy { force securityPins }
    }
}

allprojects {
    repositories {
        google()
        mavenLocal()
        mavenCentral()
        maven { url 'https://jitpack.io' }
        maven { url "https://dl.cloudsmith.io/public/indooratlas/mvn-public/maven" }
        maven { url "https://software.mobile.pendo.io/artifactory/android-release" }
    }
    configurations.configureEach {
        // Dokka 1.9.20's worker classpath breaks on Jackson 2.18 (TypeFactory signature change).
        if (!name.startsWith('dokka')) {
            resolutionStrategy { force rootProject.ext.securityPins }
        }
    }
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}

ext {
    ketch_version = '0.3.' + System.getenv('GITHUB_RUN_NUMBER')
}

dokkaHtmlMultiModule.configure {
    // Set module name displayed in the final output
    moduleName.set("Ketch SDK")

    // Suppress obvious functions like default toString or equals. Defaults to true
    suppressObviousFunctions.set(false)

    // Suppress all inherited members that were not overridden in a given class.
    // Eg. using it you can suppress toString or equals functions but you can't suppress componentN or copy on data class. To do that use with suppressObviousFunctions
    // Defaults to false
    suppressInheritedMembers.set(true)
}

tasks.register('packageDoc', Zip) {
    archiveFileName = "sdk-doc.zip"
    destinationDirectory = layout.buildDirectory.dir("doc")
    from layout.buildDirectory.dir("dokka/htmlMultiModule/")
}
